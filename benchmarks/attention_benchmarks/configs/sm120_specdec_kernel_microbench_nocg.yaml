# Same grid as sm120_specdec_kernel_microbench.yaml, but CUDA graphs disabled
# to debug long-context illegal-memory-access failures.

description: "SM120 q8 specdec kernel comparison (no CUDA graphs)"

attention_kernels:
  - triton
  - fi_prefill_noncausal
  - xqa_decode_causal

model:
  num_layers: 10
  num_q_heads: 32
  num_kv_heads: 8
  head_dim: 128
  block_size: 16

batch_specs:
  - "q8s1k"
  - "q8s2k"
  - "q8s4k"
  - "q8s8k"
  - "q8s16k"
  - "q8s32k"
  - "q8s64k"
  - "2q8s1k"
  - "2q8s2k"
  - "2q8s4k"
  - "2q8s8k"
  - "2q8s16k"
  - "2q8s32k"
  - "2q8s64k"
  - "4q8s1k"
  - "4q8s2k"
  - "4q8s4k"
  - "4q8s8k"
  - "4q8s16k"
  - "4q8s32k"
  - "4q8s64k"
  - "8q8s1k"
  - "8q8s2k"
  - "8q8s4k"
  - "8q8s8k"
  - "8q8s16k"
  - "8q8s32k"
  - "8q8s64k"
  - "16q8s1k"
  - "16q8s2k"
  - "16q8s4k"
  - "16q8s8k"
  - "16q8s16k"
  - "16q8s32k"
  # FI native non-causal prefill crashes here with CUDA illegal memory access.
  # Reproducer: ../repro_fi_noncausal_16q8s64k.sh
  # - "16q8s64k"
  - "32q8s1k"
  - "32q8s2k"
  - "32q8s4k"
  - "32q8s8k"
  - "32q8s16k"
  - "32q8s32k"
  - "32q8s64k"
  - "64q8s1k"
  - "64q8s2k"
  - "64q8s4k"
  - "64q8s8k"
  - "64q8s16k"
  - "64q8s32k"
  - "64q8s64k"

kv_cache_dtype: fp8
device: "cuda:0"
repeats: 10
warmup_iters: 5
cuda_graphs: false
profile_memory: false

output:
  csv: "sm120_specdec_kernel_microbench_grid_nocg.csv"
  json: "sm120_specdec_kernel_microbench_grid_nocg.json"
