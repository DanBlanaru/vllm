# Qwen3-235B-A22B TP4 attention benchmark for DP-imbalanced decode workloads
#
# Simulates two DP ranks with different request counts and KV cache sizes:
#   DP0: 15 running requests, ~120k total KV tokens
#   DP1: 30 running requests, ~50k total KV tokens
#
# Per-GPU (TP4): 16 Q heads, 1 KV head, head_dim=128
# No KV head duplication (4 total KV heads / 4 TP = 1 each)
#
# Usage:
#   cd benchmarks/attention_benchmarks
#   python benchmark.py --config configs/dp_imbalance_qwen3.yaml

model:
  num_layers: 1
  num_q_heads: 16    # 64 total / TP4
  num_kv_heads: 1    # 4 total / TP4
  head_dim: 128
  block_size: 16

batch_specs:
  # --- Uniform distribution ---
  # DP0: 15 reqs x 8192 = 122,880 total KV tokens
  - "15q1s8k"
  # DP1: 30 reqs x 1700 = 51,000 total KV tokens
  - "30q1s1700"

  # --- Skewed distribution (agentic workloads) ---
  # DP0: 1 req at 60k + 14 reqs at ~4.3k = ~121k total
  - "1q1s60k_14q1s4286"
  # DP1: 5 reqs at 5k + 25 reqs at 1k = ~51k total
  - "5q1s5k_25q1s1k"

  # --- Balanced reference (what rebalancing would achieve) ---
  - "22q1s3900"

backends:
  - FLASH_ATTN
  - FLASHINFER

device: "cuda:0"
repeats: 20
warmup_iters: 10
